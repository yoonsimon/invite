<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>모바일 청첩장 시안 비교</title>
<style>@font-face{font-family:P;src:url(selected/PretendardVariable.woff2)}*{box-sizing:border-box}body{margin:0;background:#faf9f6;color:#202421;font:16px/1.55 P,sans-serif}main{max-width:1280px;margin:auto;padding:32px clamp(16px,4vw,56px)}h1{font-size:clamp(32px,5vw,64px);letter-spacing:-.06em;margin:0}h2{letter-spacing:-.035em}a{color:#275d4e;text-underline-offset:3px}#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:24px}article{border-top:2px solid;padding-top:8px}figure{margin:0;display:flex;gap:8px}figure a{width:50%;font-size:13px}img{width:100%;display:block;background:#eee;aspect-ratio:390/844;object-fit:contain;object-position:top}details{margin:12px 0}small{display:block;color:#545952}#ranking{white-space:pre-line}</style>
<main><h1>모바일 청첩장 시안 비교</h1><p>같은 390px 폭에서 표지와 본문을 비교하고, 시안을 열어 하객 동선을 확인할 수 있습니다.</p><section id="ranking"></section><div id="grid"></div></main>
<script>
const shots={"v01/cover.png": "1IA9bNiTmN-JCCCIxiS4mq3vJA3MhRVQA", "v01/body.png": "1kI0jVaRYt4VREJeVNPX9kzJ2FP9mDXB5", "v02/cover.png": "184-o6oJLGPCa49LJ0Iqph-ILBLRaA8mH", "v02/body.png": "1Cj-8lSjVT3JlQwCDExDUEW7T0PfsuDlZ", "v03/cover.png": "1feXbxyxPC1akv87Y4d7do-vmeBV6XAkc", "v03/body.png": "1SzUeqqqzZ316nB_2K9dxGvskLLmaghs3", "v04/cover.png": "1jOJhJp4w9nta0oc4w7sJ9a2NTBBAW7EH", "v04/body.png": "1zsPP4sGG8pQX0NB_t0SpTg2srqmTrKWO", "v05/cover.png": "1q4MhTzCnowD1Hl2j0e4Ig-b3pZAnhTFi", "v05/body.png": "1YVRAVHaIlfIh6VdzfsWE-2enBONO_9Pv", "v06/cover.png": "1O7aVNnNDSMQvazFBpDjVZeCh4OgS6mdc", "v06/body.png": "1ujGU-d3riqdAGxQAvh_IarPNUKLrOUUK", "v07/cover.png": "1MEL1CTGJfcYcUQb16_5A-vwTrVSV-Uth", "v07/body.png": "16JX11AVG6lrAEA6HbQQlGTU-lGd7n5v1", "v08/cover.png": "1Jt8f-BUUlJmsML5ffLzKpjnUI8kKKh3T", "v08/body.png": "1tYlI-aRTf8MYCFFuwej-vRUvhA6gIG0w"};
const names=['여정표','사진띠','병풍','트랙리스트','서신','상영 프로그램','세 폭 사진','조판'];
const el=(tag,text)=>Object.assign(document.createElement(tag),{textContent:text||''});
function anchor(url,text){const a=el('a',text);a.href=url;return a}
names.forEach(async(name,i)=>{const path='v'+String(i+1).padStart(2,'0')+'/';const card=el('article');grid.append(card);const title=el('h2');title.append(anchor(path,name));card.append(title);const pair=el('figure');card.append(pair);for(const [file,label] of [['cover','표지'],['body','본문']]){const a=anchor('https://lh3.googleusercontent.com/d/'+shots[path+file+'.png']+'=w1200','');const image=el('img');image.src=a.href;image.alt=name+' '+label;a.append(image,label);pair.append(a)}card.append(anchor(path,'실제 청첩장 열기'));try{const s=await (await fetch(path+'sources.json')).json();title.firstChild.textContent=s.title;const d=el('details');d.append(el('summary','원출처와 적용 위치'));card.append(d);for(const item of s.sources){const p=el('p');p.append(anchor(item.url,item.title),el('small',item.observation),el('span',item.application));d.append(p)}}catch{}});
fetch('ranking.txt').then(r=>r.ok?r.text():'').then(t=>{if(t){ranking.append(el('h2','종합 평가'),el('p',t));}});
</script></html>
